# Grammar for CSV artifact action sequences
# REVENANT uses this to generate random action sequences for parity testing.

format: csv
version: "1.0"

actions:
  - name: sort_column
    description: Sort table by a column
    params:
      column_index:
        type: integer
        range: [0, 20]
      direction:
        type: enum
        values: [asc, desc]

  - name: filter_value
    description: Filter rows where column equals value
    params:
      column_index:
        type: integer
        range: [0, 20]
      value:
        type: string
        from: sample_values  # drawn from actual sample data

  - name: navigate_page
    description: Navigate to page N of paginated results
    params:
      page:
        type: integer
        range: [1, 10]
      page_size:
        type: enum
        values: [10, 25, 50]

  - name: search
    description: Full-text search across all columns
    params:
      query:
        type: string
        from: sample_values

  - name: select_row
    description: Select/focus a specific row
    params:
      row_index:
        type: integer
        range: [0, 9]

  - name: clear_filter
    description: Clear all active filters
    params: {}

  - name: view_detail
    description: Open detail view for selected row
    params:
      row_index:
        type: integer
        range: [0, 9]

normalization:
  ignore_presentation_differences: true
  ignore_whitespace_differences: true
  ignore_column_order: false  # CSV column order is significant
  date_format_normalize: true

properties:
  - id: P1
    description: "At least 1000 sequences run"
    min_sequences: 1000

  - id: CSV-01
    description: "Sort by any column produces N rows total"
    invariant: "row_count_unchanged_after_sort"

  - id: CSV-02
    description: "Filter then clear_filter restores original row count"
    invariant: "filter_clear_idempotent"

  - id: CSV-03
    description: "Same search query produces same result set"
    invariant: "search_deterministic"
