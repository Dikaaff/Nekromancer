# Grammar for DBF artifact action sequences

format: dbf
version: "1.0"

actions:
  - name: open_record
    description: Open a specific record by index
    params:
      record_index:
        type: integer
        range: [0, 99]

  - name: navigate_record
    description: Navigate relative to current position
    params:
      direction:
        type: enum
        values: [next, prev, first, last]

  - name: filter_field
    description: Filter records by field value
    params:
      field_name:
        type: string
        from: field_names
      value:
        type: string
        from: sample_values

  - name: clear_filter
    description: Remove active filter
    params: {}

  - name: list_records
    description: Show record listing
    params:
      page:
        type: integer
        range: [1, 10]

normalization:
  ignore_presentation_differences: true
  ignore_whitespace_differences: true
  ignore_deleted_records: true  # Records marked 0x2A are excluded from both sides
  date_format_normalize: true

properties:
  - id: DBF-01
    description: "navigate next then prev returns to original record"
    invariant: "navigate_round_trip"

  - id: DBF-02
    description: "filter then clear_filter restores full count"
    invariant: "filter_clear_idempotent"
